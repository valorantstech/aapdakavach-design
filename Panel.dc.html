<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side panel and messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes akp-slide{from{transform:translateX(40px);opacity:0}}
@keyframes akp-fade{from{opacity:0}}
@keyframes akp-rise{from{transform:translate(-50%,16px);opacity:0}}
.akp-drawer{animation:akp-slide .22s ease both}
.akp-scrim{animation:akp-fade .2s ease both}
.akp-toast{animation:akp-rise .25s ease both}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45; color: #0F1B2D">
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div class="akp-scrim" onClick="{{close}}" aria-hidden="true" style="position: fixed; inset: 0; z-index: 90; background: rgba(8, 10, 12, 0.5)"></div>
<aside class="akp-drawer" role="dialog" aria-label="{{title}}" style="position: fixed; top: 0; right: 0; bottom: 0; z-index: 91; width: 480px; max-width: 100vw; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border-left: 1px solid #98A2B3; box-shadow: -24px 0 60px rgba(8, 10, 12, 0.3)">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid #DDE2EA">
<div style="min-width: 0">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #47566B">{{kicker}}</div>
<h2 style="margin: 4px 0 0; font-size: 20px; font-weight: 600; line-height: 1.25">{{title}}</h2>
</div>
<button type="button" onClick="{{close}}" aria-label="Close the panel" style="flex: 0 0 44px; height: 44px; padding: 0; border: 1px solid #98A2B3; border-radius: 8px; background: #FFFFFF; color: #0F1B2D; font: inherit; font-size: 18px; cursor: pointer">×</button>
</header>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 18px 24px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; color: #344256">{{desc}}</p>
<sc-if value="{{isConn}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #344256; background: #E8ECF2">{{how}}</span>
<span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #344256; background: #E8ECF2">{{dir}}</span>
</div>
</sc-if>
<sc-if value="{{isDanger}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #9B1C1C; background: #FBDCDC">{{warn}}</p>
</sc-if>
<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DDE2EA; border-radius: 8px; overflow: hidden">
<div style="display: flex; gap: 10px; padding: 9px 14px; font-size: 12px; color: #47566B; background: #F7F8FA"><span style="flex: 1.3 1 0">{{h1}}</span><span style="flex: 1 1 0">{{h2}}</span><span style="flex: 1.3 1 0">{{h3}}</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; padding: 10px 14px; border-top: 1px solid #DDE2EA; font-size: 13px"><span style="flex: 1.3 1 0; font-weight: 600">{{r.a}}</span><span style="flex: 1 1 0">{{r.b}}</span><span style="flex: 1.3 1 0; color: #344256">{{r.c}}</span></div>
</sc-for>
</div>
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #0B5D3B; background: #D3F2E1">{{sum}}</p>
</sc-if>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #344256"><span>{{f.l}}</span>
<sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}">
<input type="text" aria-label="{{f.l}}" value="{{f.v}}" placeholder="{{f.ph}}" onChange="{{f.set}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #98A2B3; border-radius: 8px; background: #FFFFFF; color: #0F1B2D; font: inherit">
</sc-if>
<sc-if value="{{f.isSecret}}" hint-placeholder-val="{{ false }}">
<input type="password" aria-label="{{f.l}}" value="{{f.v}}" placeholder="Typed once, kept encrypted, never shown again" onChange="{{f.set}}" style="min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #98A2B3; border-radius: 8px; background: #FFFFFF; color: #0F1B2D; font: inherit">
</sc-if>
<sc-if value="{{f.isPick}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{f.opts}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="min-height: 38px; padding: 0 12px; border-radius: 8px; border: {{o.border}}; background: #FFFFFF; color: #0F1B2D; font: inherit; font-size: 13px; font-weight: {{o.weight}}; cursor: pointer">{{o.t}}</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<sc-for list="{{choices}}" as="c" hint-placeholder-count="2">
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px"><input type="checkbox" checked="{{c.on}}" onChange="{{c.flip}}" style="width: 18px; height: 18px">{{c.l}}</label>
</sc-for>
<sc-if value="{{hasDrop}}" hint-placeholder-val="{{ false }}">
<div style="padding: 26px 16px; border: 1px dashed #98A2B3; border-radius: 8px; text-align: center; color: #47566B">Drop the file here, or choose it from this computer.<br><span style="font-size: 12px">{{dropNote}}</span></div>
</sc-if>
<sc-if value="{{tested}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #DDE2EA; border-radius: 8px">
<div style="padding: 10px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #47566B">Connection test, just now</div>
<sc-for list="{{checks}}" as="k" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid #DDE2EA"><span>{{k}}</span><span style="padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #0B5D3B; background: #D3F2E1">Pass</span></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; font-size: 13px; color: #344256; background: #F3F5F8">{{note}}</p>
</sc-if>
</div>
<footer style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #DDE2EA">
<button type="button" onClick="{{close}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #98A2B3; border-radius: 8px; background: #FFFFFF; color: #0F1B2D; font: inherit; font-weight: 500; cursor: pointer">Cancel</button>
<sc-if value="{{isDanger}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{confirm}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #9B1C1C; border-radius: 8px; background: #FFFFFF; color: #9B1C1C; font: inherit; font-weight: 600; cursor: pointer">{{cta}}</button>
</sc-if>
<sc-if value="{{isListLink}}" hint-placeholder-val="{{ false }}">
<a href="{{href}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #1B4DBE; color: #FFFFFF; text-decoration: none; font-weight: 600">{{cta}}</a>
</sc-if>
<sc-if value="{{isNormal}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{confirm}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #1B4DBE; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">{{cta}}</button>
</sc-if>
</footer>
</aside>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div class="akp-toast" role="status" style="position: fixed; left: 50%; bottom: 28px; z-index: 95; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 48px); padding: 12px 18px; border-radius: 10px; background: #0B1F33; color: #FFFFFF; font-weight: 500; box-shadow: 0 16px 40px rgba(8, 10, 12, 0.35)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"></path></svg>
<span>{{toast}}</span>
</div>
</sc-if>
</div>
</x-dc>
